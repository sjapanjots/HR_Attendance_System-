[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#18181B"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#18181B"
borderColor = "#E4E4E7"
showWidgetBorder = true
baseRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"

[server]
# Attendance workbooks are a few MB; refuse anything unexpectedly large.
maxUploadSize = 50
