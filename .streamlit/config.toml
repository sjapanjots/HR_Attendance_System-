[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#4B6BF2"
backgroundColor = "#FBFBF8"
secondaryBackgroundColor = "#F2F2EE"
textColor = "#0A0A0A"
borderColor = "#E4E3DD"
showWidgetBorder = true
baseRadius = "12px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"

[server]
# Attendance workbooks are a few MB; refuse anything unexpectedly large.
maxUploadSize = 50
